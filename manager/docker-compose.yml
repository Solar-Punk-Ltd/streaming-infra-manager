services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: manager
      POSTGRES_USER: manager
    volumes:
      - manager-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manager -d manager"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: manager/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://manager:${POSTGRES_PASSWORD:-manager}@postgres:5432/manager
      MANAGER_PORT: "9876"
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      SHLS_ROOT: /home/solarpunk/streaming-infra-manager/manager/swarm-hls-stream
      BEE_DATA_ROOT: ${BEE_DATA_ROOT:-/home/solarpunk/streaming-infra-manager-data}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/solarpunk/streaming-infra-manager:/home/solarpunk/streaming-infra-manager
      - ${BEE_DATA_ROOT:-/home/solarpunk/streaming-infra-manager-data}:${BEE_DATA_ROOT:-/home/solarpunk/streaming-infra-manager-data}

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  manager-pg:
