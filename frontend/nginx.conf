# Mirrors the dev-time proxy in vite.config.ts. Anything that isn't a known
# API prefix falls through to index.html so the SPA router handles it.

upstream manager_api {
    server api:9876;
}

# The scheme the browser actually used. nginx listens on plain 80, so $scheme is
# always "http" here and would overwrite what the TLS edge in front reports. The
# manager reads this to decide whether the session cookie may be marked Secure.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Who the browser is, when the TLS edge is the one talking to us. Without this
# every request through the edge carries the edge container's address as its
# last X-Forwarded-For hop, and the manager's per-address login lockout then
# counts the whole internet as one visitor. Docker draws the compose network's
# subnet from these three ranges, and the edge is the only thing on it.
# The tunnel arrives from the bridge gateway, which those ranges also cover, so
# a client there can name whatever address it likes. Reaching the tunnel at all
# already means an SSH account on the host.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# The manager counts a failed sign-in only after hashing the password it was
# given, and that hash is deliberately slow and 64 MiB wide. A flood therefore
# costs the host dearly before the manager's own lockout has said a word. Ten
# attempts a minute per address, five of which may arrive at once.
limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

# Host is forwarded verbatim ($http_host, not $host) because it keeps the port.
# The manager refuses a write whose Origin does not name the Host it was sent
# to, and a browser reaching the tunnel on localhost:8080 sends the port in both.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Browser hardening, on every response including the SPA itself.
    # style-src allows inline because MUI's emotion writes its styles into the
    # document at runtime. Vite bundles every script, so script-src needs no
    # such exception. connect-src covers the API calls and both event streams,
    # which are same-origin through this server.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SSE — disable buffering and let the connection live as long as it wants.
    location /events {
        proxy_pass http://manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }

    # Metrics: JSON one-shot (/metrics), SSE stream (/metrics/stream), and
    # on-demand disk lookups (/metrics/disk/*). Buffering off so the stream
    # flows live; long timeouts cover both the stream and slow du scans.
    location /metrics {
        proxy_pass http://manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }

    # Versions: adding or updating one streams a clone and a full build as SSE,
    # which takes minutes. Same settings as /events. `^~` rather than a plain
    # prefix because nginx tries regex locations first, so adding `versions` to
    # the JSON block below would otherwise silently buffer the build log.
    location ^~ /versions {
        proxy_pass http://manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }

    # Stamp and chequebook management: buying a stamp, filling a chequebook and
    # emptying one each submit an on-chain tx and the bee API blocks until it's
    # mined, so allow a long upstream timeout (the backend caps the bee call at
    # 180s). Must precede the generic /profiles location.
    location ~ ^/profiles/[^/]+/(stamp|chequebook)(/|$) {
        proxy_pass http://manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    # Sign-in, rate limited by the zone above. nginx prefers an exact match to
    # any regex location, and this one is kept above the regex that would
    # otherwise take the path so the file reads in the same order.
    location = /auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Plain JSON API routes. /auth carries the session cookie both ways.
    location ~ ^/(auth|profiles|groups|health|services|config)(/|$) {
        proxy_pass http://manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA fallback — every other path serves the built index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
