# Mirrors the dev-time proxy in vite.config.ts. Anything that isn't a known
# API prefix falls through to index.html so the SPA router handles it.

upstream manager_api {
    server api:9876;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSE — disable buffering and let the connection live as long as it wants.
    location /events {
        proxy_pass http://manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }

    # Metrics: JSON one-shot (/metrics), SSE stream (/metrics/stream), and
    # on-demand disk lookups (/metrics/disk/*). Buffering off so the stream
    # flows live; long timeouts cover both the stream and slow du scans.
    location /metrics {
        proxy_pass http://manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }

    # Plain JSON API routes.
    location ~ ^/(profiles|groups|health|services|config)(/|$) {
        proxy_pass http://manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — every other path serves the built index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
