# The checks main-v2 requires before a merge, D06. What they prove and what
# they do not: docs/ci.md.
name: checks

on:
  pull_request:
    branches: [main-v2]
  push:
    branches: [main-v2]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned by commit, the tag in the comment. Each was released more than
      # two weeks before it was pinned here. pnpm comes from packageManager.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build common, which the other packages type against
        run: pnpm --filter @streaming-infra-manager/common build

      - name: Type checks, every package, tests included
        run: pnpm -r typecheck

      - name: Unit tests, common
        run: pnpm --filter @streaming-infra-manager/common test

      - name: Unit tests, manager
        # The tests never open a database. The config module requires the
        # variable at load, so it gets a value that names nothing.
        env:
          DATABASE_URL: postgres://unused@localhost/unused
        run: pnpm --filter @streaming-infra-manager/api test

      - name: Unit tests, frontend
        run: pnpm --filter @streaming-infra-manager/frontend-prototype test

      - name: Frontend build
        run: pnpm --filter @streaming-infra-manager/frontend-prototype build

  database:
    # The 33 SQL suites, each against the task database it owns. They gate
    # themselves on a port variable and skip without it, so the runner they go
    # through refuses an unset variable, connects to all nine databases first,
    # and treats one skip as a failure. See manager/test/database/run-all.mjs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # postgres:16-alpine, digest resolved 2026-09-10. Trust authentication
        # because these databases are created empty here, hold synthetic rows
        # for the length of one job, and are reachable only from it.
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The suites reach 127.0.0.1 and nothing else, so the port is the whole
      # configuration. The names are in the runner's own table.
      T01_TEST_PG_PORT: 5432
      T04A_TEST_PG_PORT: 5432
      T04B_TEST_PG_PORT: 5432
      T06_TEST_PG_PORT: 5432
      T08_TEST_PG_PORT: 5432
      T09_TEST_PG_PORT: 5432
      T10_TEST_PG_PORT: 5432
      T11_TEST_PG_PORT: 5432
      T12_TEST_PG_PORT: 5432
    steps:
      - name: Create the nine task databases, through the service container's own client
        # createdb ships in the postgres image, so the runner needs no client
        # of its own. A service that did not come up fails here, in seconds,
        # rather than as nine refused connections after an install.
        run: |
          for name in t01_test t04a_test t04b_test t06_test t08_test t09_test t10_test t11_test t12_test; do
            docker exec ${{ job.services.postgres.id }} createdb -U postgres "$name"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build common, which the suites type against
        run: pnpm --filter @streaming-infra-manager/common build

      - name: SQL suites, every one of the nine databases, no skip counted as a pass
        run: pnpm --filter @streaming-infra-manager/api test:database
