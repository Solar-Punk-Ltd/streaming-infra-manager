<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streaming Infra Manager · UX rework mockup</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --sub:#f0f2f5; --hover:#eaedf2; --border:#e2e5ea; --border-2:#cfd4dc;
  --text:#14171d; --text-2:#4b5563; --text-3:#8a93a3;
  --accent:#3b5bfd; --accent-2:#e9edff; --accent-text:#2a45d8;
  --ok:#158f52; --ok-bg:#e3f5ea; --warn:#b56e00; --warn-bg:#fff2dc; --err:#cf3238; --err-bg:#fde7e8; --info:#2a7fd4; --info-bg:#e6f0fb; --gray:#7f889a; --gray-bg:#eef0f4;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
}
[data-theme=dark]{
  --bg:#0e1014; --card:#161920; --sub:#1c2029; --hover:#222735; --border:#252a35; --border-2:#333a49;
  --text:#e9ebf1; --text-2:#aab1c0; --text-3:#6c7587;
  --accent:#6f88ff; --accent-2:#1c2340; --accent-text:#a2b1ff;
  --ok:#3bd27f; --ok-bg:#10301e; --warn:#f2b43c; --warn-bg:#33270c; --err:#ff6b6f; --err-bg:#3b191c; --info:#63a9ff; --info-bg:#122540; --gray:#7c8598; --gray-bg:#222735;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--sans);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:12.5px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
@media (max-width:900px){.app{grid-template-columns:1fr}.sb{display:none}}

/* sidebar */
.sb{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.brand b{display:block;font-size:14px}
.brand small{color:var(--text-3);font-size:11.5px}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-2);font-weight:500;cursor:pointer}
.nav a:hover{background:var(--hover);text-decoration:none}
.nav a.cur{background:var(--accent-2);color:var(--accent-text)}
.nav a .ico{width:18px;text-align:center;opacity:.9}
.nav a .cnt{margin-left:auto;font-size:11.5px;color:var(--text-3);background:var(--sub);padding:1px 7px;border-radius:99px}
.nav a.cur .cnt{background:rgba(255,255,255,.5)}
[data-theme=dark] .nav a.cur .cnt{background:rgba(255,255,255,.08)}
.nav .sect{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:14px 10px 4px}
.sb-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sb-foot .host{font-size:12px;color:var(--text-3);padding:4px 6px}
.sb-foot .host b{color:var(--text-2);font-weight:500}
.sb-foot .tag{font-size:11px;color:var(--text-3);padding:4px 6px}

/* main */
main{min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 28px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid transparent}
.topbar h1{font-size:18px;margin:0;font-weight:600}
.topbar .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px;width:280px}
.search input{border:0;outline:0;background:transparent;width:100%}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.view{padding:6px 28px 60px;max-width:1240px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-2);background:var(--card);border-radius:8px;padding:6px 11px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--border-2))}
.btn.danger:hover{background:var(--err-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn.icon{padding:5px 7px}
.btn .spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* pills, dots */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.gray{background:var(--gray-bg);color:var(--text-2)}
.pill.type{background:var(--sub);color:var(--text-2);font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gray);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}.dot.info{background:var(--info)}
.dot.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.card .hd h3{margin:0;font-size:14px;font-weight:600}
.card .hd .sub{color:var(--text-3);font-size:12.5px}
.card .hd .sp{flex:1}
.card .bd{padding:16px 18px}
.card .bd.tight{padding:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--text-3)}.dim{color:var(--text-2)}
.small{font-size:12.5px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:8px 16px;font-size:13px}
.kv dt{color:var(--text-3)}.kv dd{margin:0;word-break:break-all}
.hint{font-size:12px;color:var(--text-3);margin-top:4px}
.chip{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--sub);border:1px solid var(--border);padding:1px 6px;border-radius:6px;color:var(--text-2)}
.copy{display:inline-flex;align-items:center;gap:8px;background:var(--sub);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:12.5px;word-break:break-all;max-width:100%}
.copy button{margin-left:auto;flex:none}

/* bars */
.bar{height:8px;background:var(--gray-bg);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ours{background:var(--accent)}.bar .other{background:color-mix(in srgb,var(--text-3) 45%,transparent)}
.bar.thin{height:5px}
.big{font-size:26px;font-weight:600;letter-spacing:-.01em}
.stat .lbl{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);font-weight:600}

/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border)}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--hover)}
td .name{font-family:var(--mono);font-weight:600;font-size:13px}
td .sub{font-size:12px;color:var(--text-3);margin-top:2px}
td.act{text-align:right;white-space:nowrap}
td.act .btn{margin-left:4px}
tr.grp td{background:var(--sub);font-weight:500}
tr.grp:hover td{background:var(--hover)}
td.indent{padding-left:38px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.filters .f{border:1px solid var(--border);background:var(--card);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--text-2)}
.filters .f.cur{background:var(--text);color:var(--card);border-color:var(--text)}
.filters .f b{font-weight:500;opacity:.7;margin-left:4px}

/* page head */
.ph{display:flex;align-items:flex-start;gap:16px;padding:12px 0 18px}
.ph .back{font-size:13px;color:var(--text-3);display:block;margin-bottom:8px}
.ph h2{margin:0;font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px;font-family:var(--mono)}
.ph .meta{color:var(--text-3);font-size:13px;margin-top:6px}
.ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center;padding-top:26px}

/* checklist */
.check{list-style:none;margin:0;padding:0}
.check li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border)}
.check li:last-child{border-bottom:0}
.check .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--gray)}
.check .st.ok{background:var(--ok)}.check .st.warn{background:var(--warn)}.check .st.err{background:var(--err)}.check .st.busy{background:var(--info)}
.check .t{font-weight:500}
.check .d{font-size:12.5px;color:var(--text-3);margin-top:2px}
.ready{padding:14px 18px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border)}
.ready.ok{background:var(--ok-bg)}.ready.warn{background:var(--warn-bg)}.ready.err{background:var(--err-bg)}.ready.info{background:var(--info-bg)}.ready.gray{background:var(--sub)}
.ready b{font-size:14px}

/* attention list */
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border)}
.att li:last-child{border-bottom:0}
.att .txt{flex:1}
.att .txt b{font-family:var(--mono);font-weight:600}
.att .txt div{font-size:12.5px;color:var(--text-2)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.field label small{font-weight:400;color:var(--text-3)}
.in{border:1px solid var(--border-2);background:var(--card);border-radius:8px;padding:8px 10px;outline:0;width:100%}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
.in.mono{font-family:var(--mono);font-size:12.5px}
.in.err{border-color:var(--err)}
textarea.in{min-height:70px;resize:vertical}
.field .err-msg{font-size:12px;color:var(--err)}
.inrow{display:flex;gap:8px;align-items:center}
.inrow .in{flex:1}
.seg{display:flex;flex-direction:column;gap:6px}
.seg label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-weight:400;color:var(--text)}
.seg label:hover{background:var(--hover)}
.seg label.on{border-color:var(--accent);background:var(--accent-2)}
.seg input{margin-top:3px}
.seg .t{font-weight:500;font-size:13px}
.seg .d{font-size:12px;color:var(--text-3)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer}
.toggle .sw{width:34px;height:20px;border-radius:99px;background:var(--border-2);position:relative;transition:.15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on .sw{background:var(--accent)}
.toggle.on .sw::after{left:16px}

/* modal / wizard */
.ovl{position:fixed;inset:0;background:rgba(10,12,18,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:860px;max-width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--border)}
.modal .mh h3{margin:0;font-size:16px}
.modal .mb{overflow:auto;flex:1}
.modal .mf{display:flex;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--border)}
.wiz{display:grid;grid-template-columns:200px 1fr;min-height:420px}
.wiz-steps{list-style:none;margin:0;padding:22px 16px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.wiz-steps li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--text-3);font-size:13px}
.wiz-steps li span{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-2);display:grid;place-items:center;font-size:12px;flex:none}
.wiz-steps li.cur{color:var(--text);font-weight:600}
.wiz-steps li.cur span{border-color:var(--accent);background:var(--accent);color:#fff}
.wiz-steps li.done{color:var(--text-2)}
.wiz-steps li.done span{border-color:var(--ok);background:var(--ok);color:#fff}
.wiz-pane{padding:22px 26px}
.wiz-pane h4{margin:0 0 4px;font-size:16px}
.wiz-pane .lead{color:var(--text-3);margin:0 0 18px;font-size:13px}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;background:var(--card)}
.goal:hover{border-color:var(--border-2);background:var(--hover)}
.goal.on{border-color:var(--accent);background:var(--accent-2)}
.goal .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--sub);flex:none}
.goal b{display:block;font-size:14px}
.goal p{margin:3px 0 0;font-size:12.5px;color:var(--text-2)}
.goal .svc{margin-top:6px}
.goal.wide{grid-column:1/-1}
.review dl{margin:0}
.review .kv{grid-template-columns:200px 1fr}
.note{background:var(--info-bg);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-bg)}
.note.ok{background:var(--ok-bg)}

/* drawer */
.drawer-ovl{position:fixed;inset:0;background:rgba(10,12,18,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;background:var(--card);border-left:1px solid var(--border);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--border)}
.drawer .dh h3{margin:0;font-size:16px;font-family:var(--mono)}
.drawer .db{padding:18px 22px;overflow:auto;flex:1}
.drawer .df{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px}
.locked{border:1px dashed var(--border-2);border-radius:8px;padding:10px 12px;margin-bottom:16px}
.locked summary{cursor:pointer;font-size:12.5px;color:var(--text-3)}
.locked .kv{margin-top:10px;font-size:12.5px}

/* menu */
.menu{position:fixed;z-index:60;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);min-width:210px;padding:6px}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--err)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}

/* toasts */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:var(--text);color:var(--card);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:420px;animation:up .2s ease-out}
.toast.ok{background:var(--ok);color:#fff}.toast.err{background:var(--err);color:#fff}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* help */
.help{width:720px}
.help ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.help li b{display:block}
.help li span{color:var(--text-2);font-size:13px}
.confirm{width:460px}
.confirm p{margin:0 0 10px}
.empty{padding:40px;text-align:center;color:var(--text-3)}
.spark{display:inline-block;vertical-align:middle}
</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="brand"><span class="logo">SI</span><div><b>Streaming Infra</b><small>manager · lab-host-1</small></div></div>
    <nav class="nav" id="nav">
      <a data-nav="overview"><span class="ico">◫</span>Overview</a>
      <a data-nav="deployments"><span class="ico">▤</span>Deployments<span class="cnt" id="navCount"></span></a>
      <a data-nav="host"><span class="ico">◍</span>Host</a>
    </nav>
    <div class="sb-foot">
      <div class="host"><b>lab-host-1</b> · manager v0.5 · 8 cores · 32 GB</div>
      <button class="btn ghost sm" data-action="help">What changed in this design</button>
      <button class="btn ghost sm" data-action="theme">Switch light / dark</button>
      <div class="tag">Mockup with fake data · proposal 2026-09-05</div>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="title">Overview</h1>
      <div class="sp"></div>
      <div class="search" id="searchBox" hidden><span class="muted">⌕</span><input id="search" placeholder="Search deployments"></div>
      <div class="live"><i></i>live</div>
      <button class="btn pri" data-action="new">+ New deployment</button>
    </div>
    <section class="view" id="view"></section>
  </main>
</div>
<div id="overlay"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ---------------------------------------------------------------- data */
const HOST = 'lab-host-1';
const HOST_PASSPHRASE = 'labhost-shared-passphrase-01';
const RUNGS = [
  {name:'360p', kbps:700, depth:17, res:'640×360'},
  {name:'480p', kbps:1200, depth:18, res:'854×480'},
  {name:'720p', kbps:2800, depth:19, res:'1280×720'},
  {name:'1080p', kbps:5000, depth:20, res:'1920×1080'},
];
const TYPE_LABEL = {stream:'Stream', viewer:'Viewer', rung:'Bee node', 'abr-uploader':'ABR uploader', custom:'Custom'};
const TYPE_SERVICES = {stream:['srs','stream-uploader','bee-uploader'], viewer:['client','bee-gateway'], rung:['bee-uploader'], 'abr-uploader':['srs','stream-uploader'], custom:[]};
const SERVICE_WORDS = {
  srs:'media server (SRT ingest)', ome:'media server (OvenMediaEngine)', 'stream-uploader':'uploads segments to Swarm',
  'bee-uploader':'own Bee node', client:'web player', 'bee-gateway':'Swarm gateway for the player'
};

const hex = (n) => Array.from({length:n}, () => '0123456789abcdef'[Math.floor(Math.random()*16)]).join('');
const shortHex = (h) => h.length > 15 ? `${h.slice(0,8)}…${h.slice(-6)}` : h;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MAIN_KEY = '0x' + hex(64);
const MAIN_ADDR = '0x' + hex(40);

function mk(o){
  return Object.assign({
    status:'RUNNING', host:'localhost', notes:'', groupId:null, lastError:null, lastErrorAt:null,
    uploaderDeployed:false, stamp:null, wallet:null, passphrase:null, engine:'srs',
    feedOwner:null, privateKey:null, address:null, beePublishers:null, beeUrl:null, components:null,
    createdAt:'2026-09-03T10:12:00Z', everRan:true,
  }, o);
}

const state = {
  theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
  route: {page:'overview'},
  filter:'all', search:'',
  collapsed: new Set(),

let nextSlot = 14, nextGroupId = 3;

/* ------------------------------------------------------------ derived */
const byName = (n) => state.deployments.find(d => d.name === n);
const groupById = (id) => state.groups.find(g => g.id === id);
const membersOf = (g) => state.deployments.filter(d => d.groupId === g.id).sort((a,b)=>a.slot-b.slot);
const isPool = (g) => g.kind === 'abr-node-pool';
const rungOf = (d) => { const g = d.groupId && groupById(d.groupId); return g ? d.name.slice(g.name.length+1) : null; };
const servicesOf = (d) => (d.components && d.components.length ? d.components : TYPE_SERVICES[d.type]).map(s => s==='srs' && d.engine==='ome' ? 'ome' : s);
const hasSvc = (d, s) => servicesOf(d).includes(s);
const hostOf = (d) => (!d.host || d.host === 'localhost') ? HOST : d.host;

function portsFor(service, slot){
  const b = slot*10;
  return {srs:{SRT:10001+b, RTMP:10002+b, HTTP_API:10003+b}, ome:{SRT:10001+b, HTTP:10003+b}, 'stream-uploader':{}, 'bee-uploader':{API:10005+b}, client:{CLIENT_PORT:10004+b}, 'bee-gateway':{API:10006+b}}[service] || {};
}
function fakeLoad(service, slot){
  const seed = (slot*7 + service.length*13) % 17;
  const base = {srs:14, ome:16, 'stream-uploader':9, 'bee-uploader':22, client:1.2, 'bee-gateway':6}[service] || 4;
  return {cpu:+(base + seed*0.4 + Math.random()*1.5).toFixed(1), mem: {srs:180, ome:210, 'stream-uploader':140, 'bee-uploader':820, client:24, 'bee-gateway':310}[service] + seed*3};
}
function containersOf(d){
  if (d.status === 'STOPPED' || (d.status === 'ERROR' && !d.everRan)) return [];
  return servicesOf(d).filter(s => !(s === 'stream-uploader' && d.type === 'stream' && !d.uploaderDeployed))
    .map(s => ({service:s, ports:portsFor(s, d.slot), ...fakeLoad(s, d.slot)}));
}
const running = (d) => d.status === 'RUNNING';
const busy = (d) => ['DEPLOYING','STOPPING','REMOVING'].includes(d.status);

function statusPill(d){
  return {RUNNING:['Running','ok'], DEPLOYING:['Deploying','info'], STOPPING:['Stopping','warn'], STOPPED:['Stopped','gray'], REMOVING:['Removing','warn'], ERROR:['Error','err']}[d.status];
}
function readiness(d){
  if (d.status === 'ERROR') return {label:'Failed', tone:'err'};
  if (d.status === 'DEPLOYING') return {label:'Deploying…', tone:'info'};
  if (d.status === 'STOPPING') return {label:'Stopping…', tone:'warn'};
  if (d.status === 'REMOVING') return {label:'Removing…', tone:'warn'};
  if (d.status === 'STOPPED') return {label:'Stopped', tone:'gray'};
  if (d.type === 'stream'){
    if (!d.stamp) return {label:'Needs a stamp', tone:'warn'};
    if (d.stamp.state === 'expired') return {label:'Stamp expired', tone:'err'};
    if (d.stamp.state === 'settling') return {label:'Stamp settling', tone:'info'};
    if (!d.uploaderDeployed) return {label:'Uploader not started', tone:'warn'};
    if (d.stamp.ttlDays <= 7) return {label:`Stamp ends in ${d.stamp.ttlDays}d`, tone:'warn'};
    return {label:'Ready to stream', tone:'ok'};
  }
  if (d.type === 'viewer') return {label:'Watchable', tone:'ok'};
  if (d.type === 'rung'){
    if (!d.stamp) return {label:'Needs a stamp', tone:'warn'};
    if (d.stamp.state === 'expired') return {label:'Stamp expired', tone:'err'};
    if (d.stamp.state === 'settling') return {label:'Stamp settling', tone:'info'};
    return {label:'Stamped', tone:'ok'};
  }
  if (d.type === 'abr-uploader') return poolStringOk(d.beePublishers) ? {label:'Ready to stream', tone:'ok'} : {label:'Pool string invalid', tone:'err'};
  return {label:'Running', tone:'ok'};
}
const needsAttention = (d) => ['warn','err'].includes(readiness(d).tone);
function poolStringOk(s){ if (!s) return false; const parts = s.trim().split(/\s+/); return parts.length === 4 && RUNGS.every(r => parts.some(p => p.startsWith(r.name+'@'))); }
function poolRungs(s){ return s.trim().split(/\s+/).map(p => { const m = p.match(/^(\w+)@(.+)<([0-9a-f]+)>$/); return m ? {rung:m[1], url:m[2], batch:m[3]} : null; }).filter(Boolean); }

function publishUrl(d){
  const svc = servicesOf(d); const host = hostOf(d);
  if (svc.includes('ome')) { const p = 10001+d.slot*10; return `srt://${host}:${p}?streamid=srt://${host}:${p}/video/stream`; }
  if (!svc.includes('srs')) return null;
  const p = 10001+d.slot*10; const pass = d.passphrase || HOST_PASSPHRASE;
  return `srt://${host}:${p}?streamid=#!::r=live/stream,m=publish${pass ? '&passphrase=' + pass : ''}`;
}
function watchUrl(d){ return hasSvc(d,'client') ? `http://${hostOf(d)}:${10004+d.slot*10}` : null; }
function beeApiUrl(d){ return hasSvc(d,'bee-uploader') ? `http://${hostOf(d)}:${10005+d.slot*10}` : null; }
function poolString(g){
  const ms = membersOf(g);
  const ready = RUNGS.every(r => { const m = ms.find(x => rungOf(x) === r.name); return m && running(m) && m.stamp && m.stamp.state === 'active'; });
  if (!ready) return null;
  return RUNGS.map(r => { const m = ms.find(x => rungOf(x) === r.name); return `${r.name}@${beeApiUrl(m)}<${m.stamp.id}>`; }).join(' ');
}
function poolProblems(g){
  return RUNGS.map(r => { const m = membersOf(g).find(x => rungOf(x) === r.name);
    if (!m) return `${r.name}: rung is missing`;
    if (!running(m)) return `${r.name}: node is not running`;
    if (!m.stamp) return `${r.name}: no stamp yet`;
    if (m.stamp.state === 'expired') return `${r.name}: stamp expired`;
    if (m.stamp.state === 'settling') return `${r.name}: stamp still settling`;
    return null; }).filter(Boolean);
}
function streamers(){ return state.deployments.filter(d => (d.type === 'stream' || d.type === 'abr-uploader') && d.address); }
function streamerForAddress(addr){ return streamers().find(s => s.address === addr) || null; }
function fmtDate(iso){ return new Date(iso).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}); }

/* --------------------------------------------------------- checklist */
function checklist(d){
  const steps = [];
  const cont = containersOf(d);
  const contState = running(d) ? 'ok' : d.status === 'DEPLOYING' ? 'busy' : d.status === 'ERROR' ? 'err' : 'off';
  steps.push({t:'Containers running', st:contState,
    d: running(d) ? cont.map(c=>c.service).join(', ') : d.status === 'ERROR' ? 'Last deploy failed, see the error below' : d.status === 'DEPLOYING' ? 'Starting containers…' : 'Stopped',
    act: !running(d) && !busy(d) ? {label: d.status === 'ERROR' ? 'Retry' : 'Start', action:'start', pri:true} : null});

  if (d.type === 'stream' || d.type === 'rung'){
    const w = d.wallet || {xdai:'0', bzz:'0'};
    const funded = +w.xdai > 0.01 && +w.bzz > 0;
    steps.push({t:'Bee node funded', st: funded ? 'ok' : running(d) ? 'warn' : 'off',
      d: funded ? `xDAI ${w.xdai} for gas · BZZ ${w.bzz} for storage` : +w.bzz <= 0 ? `Has xDAI ${w.xdai} but no BZZ. Send BZZ to the node address to be able to buy a stamp.` : 'Send xDAI and BZZ to the node address',
      act: {label:'Copy node address', action:'copy', value: d.address}});
    const s = d.stamp;
    steps.push({t:'Postage stamp set', st: !s ? (funded && running(d) ? 'warn' : 'off') : s.state === 'expired' ? 'err' : s.state === 'settling' ? 'busy' : s.ttlDays <= 7 ? 'warn' : 'ok',
      d: !s ? 'A stamp is prepaid Swarm storage. Buy one below once the node has BZZ.' : s.state === 'expired' ? 'Expired. Uploads fail until a new stamp is bought and set.' : s.state === 'settling' ? 'Bought, waiting for the network to confirm it (a few minutes). It is set automatically.' : `${s.ttlDays} days left · batch ${shortHex(s.id)} · depth ${s.depth}`,
      act: (!s || s.state === 'expired') ? {label:'Buy stamp', action:'scroll', value:'#storage', pri: funded && running(d)} : s.ttlDays <= 7 ? {label:'Buy next stamp', action:'scroll', value:'#storage'} : null});
  }
  if (d.type === 'stream'){
    const s = d.stamp; const canDeploy = running(d) && s && s.state === 'active' && !d.uploaderDeployed;
    steps.push({t:'Uploader running', st: d.uploaderDeployed && running(d) ? 'ok' : canDeploy ? 'warn' : 'off',
      d: d.uploaderDeployed ? 'stream-uploader is publishing segments to Swarm' : canDeploy ? 'Stamp is set. Start the uploader to complete the stack.' : 'Held back until a stamp is set. The rest of the stack runs meanwhile.',
      act: canDeploy ? {label:'Start uploader', action:'deployUploader', pri:true} : null});
  }
  if (d.type === 'abr-uploader'){
    const ok = poolStringOk(d.beePublishers);
    steps.push({t:'Node pool reachable', st: ok ? 'ok' : 'err', d: ok ? `4 rungs · ${poolRungs(d.beePublishers)[0].url.replace(/:\d+$/,'')} and 3 more` : 'The pasted pool string is not usable. Fix it under Edit.', act: ok ? null : {label:'Edit', action:'edit'}});
  }
  if (d.type === 'viewer' || (d.type === 'custom' && hasSvc(d,'client'))){
    const s = streamerForAddress(d.feedOwner);
    steps.push({t:'Following a stream', st: d.feedOwner ? 'ok' : 'warn', d: d.feedOwner ? (s ? `${s.name} on this manager (${shortHex(d.feedOwner)})` : `External streamer ${shortHex(d.feedOwner)}`) : 'No streamer address set', act: s ? {label:'Open stream', action:'open', value:s.name} : null});
  }
  return steps;
}
function readySummary(d){
  const r = readiness(d);
  if (d.type === 'stream' || d.type === 'abr-uploader'){
    if (r.tone === 'ok') return {tone:'ok', title:'Ready. Point OBS or FFmpeg at this URL:', url: publishUrl(d)};
    return {tone:r.tone, title: r.tone === 'gray' ? 'Stopped. Start it to get a publish URL.' : `Not ready yet: ${r.label.toLowerCase()}.`, url: null};
  }
  if (d.type === 'viewer' || hasSvc(d,'client')){
    if (running(d)) return {tone:'ok', title:'Watchable. Open the player:', url: watchUrl(d), link:true};
    return {tone:r.tone, title: r.tone === 'gray' ? 'Stopped. Start it to serve the player.' : 'Not watchable right now.', url:null};
  }
  if (d.type === 'rung') return r.tone === 'ok' ? {tone:'ok', title:'This node is ready to receive uploads for its rung.', url:null} : {tone:r.tone, title:`Not ready: ${r.label.toLowerCase()}.`, url:null};
  return running(d) ? {tone:'ok', title:'Running.', url:null} : {tone:r.tone, title:r.label, url:null};
}

/* ---------------------------------------------------------- actions */
function toast(msg, tone){
  const el = document.createElement('div'); el.className = 'toast ' + (tone || ''); el.textContent = msg;
  document.getElementById('toasts').appendChild(el); setTimeout(() => el.remove(), 3800);
}
function log(text, tone){ state.activity.unshift({t: new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), text, tone}); state.activity = state.activity.slice(0, 8); }
async function copy(v){ try { await navigator.clipboard.writeText(v); } catch {} toast('Copied to clipboard'); }

function startDeployment(name){
  const d = byName(name); if (!d || busy(d)) return;
  d.status = 'DEPLOYING'; d.lastError = null; render();
  setTimeout(() => { d.status = 'RUNNING'; d.everRan = true; log(`${name} is running`, 'ok'); render(); toast(`${name} is running`, 'ok'); }, 1800);
}
function stopDeployment(name){
  const d = byName(name); if (!d || busy(d)) return;
  d.status = 'STOPPING'; render();
  setTimeout(() => { d.status = 'STOPPED'; log(`${name} stopped`); render(); }, 1200);
}
function removeDeployment(name){
  const d = byName(name); if (!d) return;
  d.status = 'REMOVING'; render();
  setTimeout(() => { state.deployments = state.deployments.filter(x => x.name !== name); log(`${name} removed`); if (state.route.page === 'detail' && state.route.id === name) go('deployments'); render(); toast(`${name} removed`); }, 1200);
}
function deployUploader(name){
  const d = byName(name); if (!d) return;
  d.status = 'DEPLOYING'; render();
  setTimeout(() => { d.status = 'RUNNING'; d.uploaderDeployed = true; log(`${name} uploader is publishing`, 'ok'); render(); toast('Uploader started. The stream is ready.', 'ok'); }, 1500);
}
function buyStamp(name, amount, depth){
  const d = byName(name); if (!d) return;
  const days = Math.max(1, Math.round(amount / 1200000));
  d.stamp = {id: hex(64), state:'settling', ttlDays: days, depth, amount: String(amount)};
  log(`${name} bought a stamp, waiting for it to settle`, 'info'); render(); toast('Stamp bought. It becomes usable in a few minutes and is set automatically.');
  setTimeout(() => { if (d.stamp && d.stamp.state === 'settling') { d.stamp.state = 'active'; log(`${name} stamp is usable and set`, 'ok'); render(); toast(`${name}: stamp is usable and set`, 'ok'); } }, 3500);
}
function useStamp(name, id, days){ const d = byName(name); if (!d) return; d.stamp = {id, state:'active', ttlDays:days, depth:19, amount:'20000000'}; render(); toast('Stamp set on this deployment', 'ok'); }
function startGroup(g){ membersOf(g).filter(m => !running(m) && !busy(m)).forEach(m => startDeployment(m.name)); }
function stopGroup(g){ membersOf(g).filter(m => running(m)).forEach(m => stopDeployment(m.name)); }
function addMembers(g, n){
  const existing = membersOf(g).length;
  for (let i = 1; i <= n; i++){
    const tpl = membersOf(g)[0];
    state.deployments.push(mk({name:`${g.name}-profile-${existing+i}`, type: tpl ? tpl.type : 'viewer', slot: nextSlot++, groupId:g.id, feedOwner: tpl ? tpl.feedOwner : null, status:'DEPLOYING', everRan:false, createdAt: new Date().toISOString()}));
  }
  g.size += n; render(); toast(`${n} member${n>1?'s':''} added to ${g.name}, deploying`);
  setTimeout(() => { membersOf(g).filter(m => m.status === 'DEPLOYING').forEach(m => { m.status = 'RUNNING'; m.everRan = true; }); render(); }, 1800);
}
function removeGroup(g){
  membersOf(g).forEach(m => m.status = 'REMOVING'); render();
  setTimeout(() => { state.deployments = state.deployments.filter(d => d.groupId !== g.id); state.groups = state.groups.filter(x => x.id !== g.id); go('deployments'); toast(`Group ${g.name} removed`); }, 1200);
}

/* ------------------------------------------------------------ router */
function go(page, id){ state.route = {page, id}; state.menu = null; window.scrollTo(0,0); render(); }

/* ------------------------------------------------------------ render */
const $ = (s) => document.querySelector(s);
function render(){
  document.documentElement.dataset.theme = state.theme;
  const r = state.route;
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('cur', a.dataset.nav === r.page || (r.page === 'detail' || r.page === 'group') && a.dataset.nav === 'deployments'));
  $('#navCount').textContent = state.deployments.length;
  $('#searchBox').hidden = r.page !== 'deployments';
  const v = $('#view');
  if (r.page === 'overview'){ $('#title').textContent = 'Overview'; v.innerHTML = renderOverview(); }
  else if (r.page === 'deployments'){ $('#title').textContent = 'Deployments'; v.innerHTML = renderDeployments(); }
  else if (r.page === 'host'){ $('#title').textContent = 'Host'; v.innerHTML = renderHost(); }
  else if (r.page === 'detail'){ const d = byName(r.id); if (!d) return go('deployments'); $('#title').textContent = 'Deployments'; v.innerHTML = renderDetail(d); }
  else if (r.page === 'group'){ const g = groupById(r.id); if (!g) return go('deployments'); $('#title').textContent = 'Deployments'; v.innerHTML = renderGroup(g); }
  renderOverlay();
}

function pill(x){ return `<span class="pill ${x.tone}">${esc(x.label)}</span>`; }
function dot(d){ const s = statusPill(d)[1]; return `<span class="dot ${s} ${busy(d) ? 'pulse' : ''}"></span>`; }
function copyBox(v, label){ return `<div class="copy"><span>${esc(v)}</span><button class="btn sm" data-action="copy" data-value="${esc(v)}">Copy${label ? ' ' + label : ''}</button></div>`; }
function primaryAction(d){
  if (busy(d)) return `<button class="btn sm" disabled><span class="spin"></span>${statusPill(d)[0]}…</button>`;
  if (running(d)) return `<button class="btn sm" data-action="stop" data-name="${d.name}">Stop</button>`;
  return `<button class="btn sm pri" data-action="start" data-name="${d.name}">${d.status === 'ERROR' ? 'Retry' : 'Start'}</button>`;
}
function menuBtn(d){ return `<button class="btn sm icon" data-action="menu" data-name="${d.name}" title="More">⋯</button>`; }

/* overview */
function renderOverview(){
  const h = state.host; const ds = state.deployments;
  const att = ds.filter(needsAttention);
  const poolIssues = state.groups.filter(isPool).map(g => ({g, problems: poolProblems(g)})).filter(x => x.problems.length);
  const streams = ds.filter(d => d.type === 'stream' || d.type === 'abr-uploader');
  const counts = {running: ds.filter(running).length, attention: att.length, stopped: ds.filter(d => d.status === 'STOPPED').length};
  const attItems = [
    ...att.map(d => { const r = readiness(d); return `<li><span class="dot ${r.tone}"></span><div class="txt"><b>${d.name}</b><div>${attentionText(d)}</div></div>${attentionAction(d)}<button class="btn sm" data-action="open" data-name="${d.name}">Open</button></li>`; }),
    ...poolIssues.map(({g, problems}) => `<li><span class="dot warn"></span><div class="txt"><b>${g.name}</b><div>Node pool not ready: ${esc(problems.join(', '))}. The pool string cannot be copied yet.</div></div><button class="btn sm" data-action="openGroup" data-id="${g.id}">Open pool</button></li>`),
  ];
  return `
  <div class="stack">
    <div class="grid g2">
      <div class="card"><div class="hd"><h3>Host</h3><span class="sub">${HOST} · ${h.cores} cores · ${h.memGb} GB</span><span class="sp"></span><button class="btn ghost sm" data-nav="host">Details</button></div>
        <div class="bd stack" style="gap:14px">
          ${hostBar('CPU', `${h.cpu}%`, h.oursCpu/100, (h.cpu-h.oursCpu)/100, `our stacks ${h.oursCpu}% · other ${h.cpu-h.oursCpu}%`)}
          ${hostBar('Memory', `${h.memUsed} / ${h.memGb} GB`, h.oursMem/h.memGb, (h.memUsed-h.oursMem)/h.memGb, `our stacks ${h.oursMem} GB · other ${(h.memUsed-h.oursMem).toFixed(1)} GB`)}
          ${hostBar('Disk', `${h.diskUsed} / ${h.diskGb} GB`, 0, h.diskUsed/h.diskGb, `whole root filesystem`)}
        </div></div>
      <div class="card"><div class="hd"><h3>Deployments</h3><span class="sp"></span><button class="btn ghost sm" data-nav="deployments">All</button></div>
        <div class="bd">
          <div class="grid g3" style="gap:12px">
            <div class="stat"><div class="lbl">Running</div><div class="big" style="color:var(--ok)">${counts.running}</div></div>
            <div class="stat"><div class="lbl">Need attention</div><div class="big" style="color:${counts.attention ? 'var(--warn)' : 'inherit'}">${counts.attention}</div></div>

}
function hostBar(label, value, ours, other, foot){
  return `<div><div class="row" style="justify-content:space-between"><span class="dim" style="font-weight:500">${label}</span><span class="mono">${value}</span></div>
    <div class="bar" style="margin:6px 0 4px"><i class="ours" style="width:${(ours*100).toFixed(1)}%"></i><i class="other" style="width:${(Math.max(0,other)*100).toFixed(1)}%"></i></div><div class="hint">${foot}</div></div>`;

function attentionText(d){
  const r = readiness(d);
  if (d.status === 'ERROR') return `Deploy failed: ${esc(d.lastError || 'unknown error')}`;
  if (r.label === 'Needs a stamp') return (d.wallet && +d.wallet.bzz <= 0) ? 'No stamp and no BZZ on its node. Fund the node, then buy a stamp.' : 'Running, but it cannot upload until a stamp is bought and set.';
  if (r.label === 'Stamp expired') return 'The stamp ran out. Buy a new one to upload again.';
  if (r.label === 'Uploader not started') return 'Stamp is set. Start the uploader to finish the stack.';
  if (r.label.startsWith('Stamp ends')) return 'Buy the next stamp before this one runs out.';
  if (r.label === 'Pool string invalid') return 'Its node pool string cannot be parsed, so it will not start.';
  return r.label;
}
function attentionAction(d){
  const r = readiness(d);
  if (d.status === 'ERROR') return `<button class="btn sm pri" data-action="start" data-name="${d.name}">Retry</button>`;
  if (r.label === 'Uploader not started') return `<button class="btn sm pri" data-action="deployUploader" data-name="${d.name}">Start uploader</button>`;
  if (r.label === 'Needs a stamp' && d.wallet && +d.wallet.bzz <= 0) return `<button class="btn sm" data-action="copy" data-value="${d.address}">Copy node address</button>`;
  if (r.label === 'Needs a stamp' || r.label === 'Stamp expired') return `<button class="btn sm pri" data-action="open" data-name="${d.name}" data-anchor="#storage">Buy stamp</button>`;
  return '';
}

/* deployments list */
function renderDeployments(){
  const f = state.filter, q = state.search.trim().toLowerCase();
  const match = (d) => (!q || d.name.includes(q) || (d.notes||'').toLowerCase().includes(q)) && (
    f === 'all' || (f === 'streams' && (d.type === 'stream' || d.type === 'abr-uploader')) || (f === 'viewers' && d.type === 'viewer') || (f === 'abr' && (d.type === 'rung' || d.type === 'abr-uploader')) || (f === 'attention' && needsAttention(d)));
  const counts = {all: state.deployments.length, streams: state.deployments.filter(d=>d.type==='stream'||d.type==='abr-uploader').length, viewers: state.deployments.filter(d=>d.type==='viewer').length, abr: state.deployments.filter(d=>d.type==='rung'||d.type==='abr-uploader').length, groups: state.groups.length, attention: state.deployments.filter(needsAttention).length};
  const filters = [['all','All'],['streams','Streams'],['viewers','Viewers'],['abr','ABR'],['groups','Groups'],['attention','Needs attention']];
  const rows = [];
  for (const g of state.groups){
    const ms = membersOf(g).filter(f === 'groups' ? () => true : match);
    if (!ms.length && f !== 'groups') continue;
    const all = membersOf(g); const run = all.filter(running).length; const open = !state.collapsed.has(g.id);
    const gr = groupReadiness(g);
    rows.push(`<tr class="grp clk" data-toggle="${g.id}"><td style="width:22px"><span class="muted">${open ? '▾' : '▸'}</span></td>
      <td><div class="name">${g.name}</div><div class="sub">${isPool(g) ? 'ABR node pool · 4 Bee nodes, one per quality' : `Group · ${all.length} ${TYPE_LABEL[(all[0]||{}).type] ? TYPE_LABEL[all[0].type].toLowerCase() + 's' : 'members'}`}</div></td>
      <td>${pill(gr)}</td><td class="small muted">${run}/${all.length} running</td>
      <td class="act">${all.some(running) ? `<button class="btn sm" data-action="stopGroup" data-id="${g.id}">Stop all</button>` : ''}${all.some(m => !running(m) && !busy(m)) ? `<button class="btn sm pri" data-action="startGroup" data-id="${g.id}">Start all</button>` : ''}<button class="btn sm" data-action="openGroup" data-id="${g.id}">Open</button></td></tr>`);
    if (open) rows.push(...ms.map(d => row(d, true)));
  }
  if (f !== 'groups') rows.push(...state.deployments.filter(d => !d.groupId && match(d)).map(d => row(d, false)));
  return `
    <div class="filters">${filters.map(([k,l]) => `<span class="f ${f===k?'cur':''}" data-filter="${k}">${l}<b>${counts[k]}</b></span>`).join('')}</div>
    <div class="card"><div class="bd tight"><table>
      <thead><tr><th></th><th>Name</th><th>State</th><th>Links</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody>${rows.length ? rows.join('') : `<tr><td colspan="5"><div class="empty">Nothing matches.</div></td></tr>`}</tbody></table></div></div>
    <p class="hint" style="margin-top:10px">Click a row to open it. Every action is on the row itself, nothing needs to be selected first.</p>`;
}
function row(d, indent){
  const r = readiness(d); const pu = publishUrl(d), wu = watchUrl(d);
  const links = [
    pu && r.tone === 'ok' ? `<button class="btn ghost sm" data-action="copy" data-value="${esc(pu)}" title="${esc(pu)}">⧉ Publish URL</button>` : '',
    wu && running(d) ? `<a class="btn ghost sm" href="${wu}" target="_blank" rel="noopener" data-stop>↗ Watch</a>` : '',
  ].join('');
  const sub = [TYPE_LABEL[d.type] + (d.type === 'rung' ? ` · ${rungOf(d)} rung` : ''), `slot ${d.slot}`, hostOf(d), d.type === 'custom' ? servicesOf(d).join(' + ') : null].filter(Boolean).join(' · ');
  return `<tr class="clk" data-open="${d.name}"><td style="width:22px" class="${indent?'indent':''}">${dot(d)}</td>
    <td><div class="name">${d.name}</div><div class="sub">${sub}</div></td><td>${pill(r)}</td><td>${links}</td>
    <td class="act">${primaryAction(d)}${menuBtn(d)}</td></tr>`;
}
function groupReadiness(g){
  const ms = membersOf(g);
  if (isPool(g)){ const s = poolString(g); if (s) return {label:'Pool ready', tone:'ok'}; if (ms.some(busy)) return {label:'Deploying…', tone:'info'}; return {label:`${ms.filter(m => m.stamp && m.stamp.state === 'active').length}/4 rungs stamped`, tone:'warn'}; }
  if (ms.every(running)) return {label:'All running', tone:'ok'};
  if (ms.some(busy)) return {label:'Changing…', tone:'info'};
  if (ms.some(running)) return {label:'Partly running', tone:'warn'};
  return {label:'Stopped', tone:'gray'};
}

function renderStorage(d){

/* host page */
function renderHost(){
  const h = state.host;
  const groupsView = [...state.groups.map(g => ({label:g.name, ds: membersOf(g)})), ...state.deployments.filter(d => !d.groupId).map(d => ({label:d.name, ds:[d]}))];
  return `<div class="stack">
    <div class="grid g3">
      ${bigStat('CPU', `${h.cpu}%`, `${(h.cpu/100*h.cores).toFixed(1)} of ${h.cores} cores in use`, h.oursCpu/100, (h.cpu-h.oursCpu)/100, `our stacks ${h.oursCpu}% (${(h.oursCpu/100*h.cores).toFixed(1)} cores) · everything else ${h.cpu-h.oursCpu}%`)}
      ${bigStat('Memory', `${Math.round(h.memUsed/h.memGb*100)}%`, `${h.memUsed} of ${h.memGb} GB`, h.oursMem/h.memGb, (h.memUsed-h.oursMem)/h.memGb, `our stacks ${h.oursMem} GB · everything else ${(h.memUsed-h.oursMem).toFixed(1)} GB`)}
      ${bigStat('Disk', `${Math.round(h.diskUsed/h.diskGb*100)}%`, `${h.diskUsed} of ${h.diskGb} GB`, 0, h.diskUsed/h.diskGb, 'whole root filesystem · per-deployment data size is in the table')}
    </div>
    <div class="grid g2">
      <div class="card"><div class="bd"><div class="stat"><div class="lbl">Network now</div><div class="big" style="font-size:20px">↓ ${h.netIn} MB/s · ↑ ${h.netOut} MB/s</div><div class="hint">our stacks ↓ 9.8 · ↑ 44.0 MB/s</div></div></div></div>
      <div class="card"><div class="bd"><div class="stat"><div class="lbl">Disk I/O now</div><div class="big" style="font-size:20px">R 3.1 MB/s · W 22.4 MB/s</div><div class="hint">our stacks R 2.0 · W 21.1 MB/s</div></div></div></div>
    </div>
    <div class="row small muted"><span class="dot" style="background:var(--accent)"></span> our stacks &nbsp; <span class="dot" style="background:color-mix(in srgb,var(--text-3) 45%,transparent)"></span> everything else on the machine (other containers, system) &nbsp; <span class="dot" style="background:var(--gray-bg)"></span> free</div>
    <div class="card"><div class="hd"><h3>Per deployment</h3><span class="sub">containers this manager started</span></div><div class="bd tight"><table><thead><tr><th>Deployment / service</th><th>State</th><th>CPU</th><th>Memory</th><th style="text-align:right">Network</th><th style="text-align:right">Data on disk</th></tr></thead><tbody>
      ${groupsView.map(({label, ds}) => { const cs = ds.flatMap(d => containersOf(d).map(c => ({...c, d}))); if (!cs.length) return `<tr><td class="mono">${label}</td><td colspan="5" class="small muted">not running</td></tr>`;
        const cpu = cs.reduce((s,c)=>s+c.cpu,0), mem = cs.reduce((s,c)=>s+c.mem,0);
        return `<tr class="grp"><td class="mono">${label} <span class="muted small" style="font-family:var(--sans)">${cs.length} containers</span></td><td></td><td>${cpu.toFixed(1)}%</td><td>${(mem/1024).toFixed(2)} GB</td><td style="text-align:right" class="small">↓ ${(cs.length*0.9).toFixed(1)} ↑ ${(cs.length*3.2).toFixed(1)} MB/s</td><td style="text-align:right" class="small">${(ds.length*1.7+cs.length*0.4).toFixed(1)} GB</td></tr>` +
          cs.map(c => `<tr><td class="indent mono small">${ds.length>1 ? `${c.d.name} · ` : ''}${c.service}</td><td><span class="pill ok">running</span></td><td style="width:140px"><div class="small">${c.cpu}% ${spark()}</div><div class="bar thin"><i class="ours" style="width:${Math.min(100,c.cpu*2)}%"></i></div></td><td style="width:140px"><div class="small">${c.mem} MB</div><div class="bar thin"><i class="ours" style="width:${Math.min(100,c.mem/12)}%"></i></div></td><td style="text-align:right" class="small muted">↓ 0.9 ↑ 3.2 MB/s</td><td></td></tr>`).join(''); }).join('')}
    </tbody></table></div></div></div>`;
}
function bigStat(label, value, sub, ours, other, foot){
  return `<div class="card"><div class="bd"><div class="stat"><div class="lbl">${label}</div><div class="row" style="align-items:baseline;gap:10px"><span class="big">${value}</span><span class="small muted">${sub}</span></div></div>
    <div class="bar" style="margin:10px 0 6px"><i class="ours" style="width:${(ours*100).toFixed(1)}%"></i><i class="other" style="width:${(Math.max(0,other)*100).toFixed(1)}%"></i></div><div class="hint">${foot}</div></div></div>`;
}
function spark(){ const pts = Array.from({length:16}, (_, i) => `${i*4},${14 - Math.random()*10}`).join(' '); return `<svg class="spark" width="64" height="16"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`; }

function wizError(w){
  if (w.step === 2){ if (!w.name) return 'Enter a name'; if (!/^[a-z0-9][a-z0-9-]{0,30}$/.test(w.name)) return 'Name: lowercase letters, digits and dashes, max 31 characters'; if (w.goal === 'pool' && w.name.length > 25) return 'Pool name: max 25 characters, members are named <pool>-1080p'; if (byName(w.name) || state.groups.some(g => g.name === w.name)) return 'That name is taken'; if (w.host === 'custom' && !w.hostCustom) return 'Enter the host'; if (w.group && (!Number.isInteger(+w.size) || +w.size < 1)) return 'Group size must be a whole number of at least 1'; }

function wizardDeploy(){
  const w = state.wizard; const host = w.host === 'this' ? 'localhost' : w.hostCustom; const now = new Date().toISOString();

    const g = {id: nextGroupId++, name: w.name, kind:'abr-node-pool', size:4, createdAt: now}; state.groups.push(g);
    RUNGS.forEach(r => state.deployments.push(mk({name:`${w.name}-${r.name}`, type:'rung', slot: nextSlot++, groupId:g.id, host, notes:w.notes, address:'0x'+hex(40), wallet:{xdai:'0.0000', bzz:'0.0000'}, status:'DEPLOYING', everRan:false, createdAt: now})));
    target = () => go('group', g.id);
  } else {
    const type = w.goal === 'custom' ? 'custom' : w.goal;
    const base = {type, host, notes:w.notes, engine:w.engine, passphrase: (type==='stream' && w.engine==='srs') || type==='abr-uploader' || (type==='custom' && w.components.includes('srs')) ? pass : null,

      beePublishers: type==='abr-uploader' ? (w.poolMode==='pick' ? poolString(groupById(+w.poolId)) : w.poolString.trim()) : null,
      components: type==='custom' ? w.components : null, beeUrl: w.beeMode==='external' ? w.beeUrl : null,
      stamp: type==='stream' && w.stampMode==='paste' ? {id:w.stampId.replace(/^0x/,''), state:'active', ttlDays:30, depth:20, amount:'30000000'} : null,
      wallet: type==='stream' ? {xdai:'0.0000', bzz:'0.0000'} : null, status:'DEPLOYING', everRan:false, createdAt: now};
    if (base.privateKey) base.address = '0x'+hex(40);
    if (w.group){
      const g = {id: nextGroupId++, name: w.name, kind:'standard', size:+w.size, createdAt: now}; state.groups.push(g);
      for (let i = 1; i <= +w.size; i++) state.deployments.push(mk({...base, name:`${w.name}-profile-${i}`, slot: nextSlot++, groupId:g.id}));

  }
  const created = state.deployments.filter(d => d.status === 'DEPLOYING' && !d.everRan);

  log(`${w.name} created and deploying`, 'info');

}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action],[data-nav],[data-open],[data-toggle],[data-filter],[data-goal],[data-close],[data-stop],[data-w-toggle],a[data-stop]');
  if (!t) { if (state.menu) { state.menu = null; render(); } return; }
  if (t.matches('a[href][data-stop]')) { e.stopPropagation(); return; }
  if (t.dataset.close){ if (t === e.target) { if (t.dataset.close === 'wizard' || t.dataset.close === 'drawer' || t.dataset.close === 'confirm' || t.dataset.close === 'help') { state[t.dataset.close === 'help' ? 'help' : t.dataset.close] = t.dataset.close === 'help' ? false : null; render(); } } return; }
  if (t.dataset.stop !== undefined && !t.dataset.action) return;
  if (t.dataset.nav){ go(t.dataset.nav); return; }
  if (t.dataset.open){ if (e.target.closest('button,a,form,input')) return; go('detail', t.dataset.open); return; }
  if (t.dataset.toggle){ if (e.target.closest('button,a')) return; const id = +t.dataset.toggle; state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id); render(); return; }
  if (t.dataset.filter){ state.filter = t.dataset.filter; render(); return; }
  if (t.dataset.goal){ state.wizard.goal = t.dataset.goal; if (t.dataset.goal === 'pool' || t.dataset.goal === 'abr-uploader') state.wizard.group = false; render(); return; }
  if (t.dataset.wToggle){ state.wizard[t.dataset.wToggle] = !state.wizard[t.dataset.wToggle]; render(); return; }
  const a = t.dataset.action, name = t.dataset.name, id = +t.dataset.id, val = t.dataset.value;
  if (state.menu && a !== 'menu') state.menu = null;
  switch (a){
    case 'theme': state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); break;
    case 'help': state.help = true; render(); break;
    case 'closeHelp': state.help = false; render(); break;
    case 'new': openWizard(); break;
    case 'newViewer': openWizard({goal:'viewer', step:2, feedMode:'pick', feedStreamer:name, name:`${name}-viewer`}); break;
    case 'newAbrUploader': openWizard({goal:'abr-uploader', step:2, poolMode:'pick', poolId:id, name:`${groupById(id).name}-uploader`}); break;
    case 'closeWizard': state.wizard = null; render(); break;
    case 'wizBack': state.wizard.step--; render(); break;
    case 'wizNext': if (!wizError(state.wizard)) { state.wizard.step++; render(); } break;
    case 'wizDeploy': wizardDeploy(); break;
    case 'wizRegenPass': state.wizard.genPass = `stage-${hex(8)}-${hex(6)}`; render(); break;
    case 'wizRegenKey': state.wizard.key = '0x'+hex(64); render(); break;
    case 'copy': copy(val); break;
    case 'open': go('detail', name); if (t.dataset.anchor) setTimeout(() => document.querySelector(t.dataset.anchor)?.scrollIntoView({behavior:'smooth', block:'start'}), 50); break;
    case 'openGroup': go('group', id); break;
    case 'scroll': document.querySelector(val)?.scrollIntoView({behavior:'smooth', block:'start'}); break;
    case 'start': startDeployment(name); break;
    case 'stop': stopDeployment(name); break;
    case 'deployUploader': deployUploader(name); break;
    case 'useStamp': useStamp(name, val, +t.dataset.days); break;
    case 'refresh': toast('Refreshed from the Bee node'); break;
    case 'remove': confirmRemove(byName(name)); break;
    case 'removeGroup': confirmRemoveGroup(groupById(id)); break;
    case 'startGroup': startGroup(groupById(id)); break;
    case 'stopGroup': stopGroup(groupById(id)); break;
    case 'edit': openEdit(byName(name)); break;
    case 'editGroup': openEditGroup(groupById(id)); break;
    case 'closeDrawer': state.drawer = null; render(); break;
    case 'drawerSave': drawerSave(); break;
    case 'drawerGenPass': state.drawer.f.pass = `stage-${hex(8)}-${hex(6)}`; render(); break;
    case 'drawerGenKey': state.drawer.f.key = '0x'+hex(64); render(); break;
    case 'drawerPickFeed': state.drawer.f.feedOwner = val; render(); break;
    case 'closeConfirm': state.confirm = null; render(); break;
    case 'confirmOk': { const fn = state.confirm.onOk; state.confirm = null; fn(); break; }
    case 'menu': { e.stopPropagation(); const d = byName(name); const r = t.getBoundingClientRect(); const items = [{label:'Open', action:'open', name}, {label:'Edit', action:'edit', name}];
      if (d.type === 'stream' && running(d)) items.push({label:'Create a viewer for this stream', action:'newViewer', name});
      if (publishUrl(d) && running(d)) items.push({label:'Copy publish URL', action:'copy', name, value:publishUrl(d)});
      items.push('hr', {label:'Remove…', action:'remove', name, danger:true});
      state.menu = {x: Math.min(r.left, innerWidth - 240), y: r.bottom + 6, items}; render(); break; }
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'search'){ state.search = t.value; const tb = $('#view'); tb.innerHTML = renderDeployments(); return; }
  if (t.dataset.w !== undefined && state.wizard){ state.wizard[t.dataset.w] = t.value; const err = wizError(state.wizard); const btn = document.querySelector('[data-action=wizNext]'); if (btn) btn.disabled = !!err; const msg = document.querySelector('.mf span span'); const holder = document.querySelector('.mf > span'); if (holder) holder.innerHTML = err ? `<span style="color:var(--warn)">${esc(err)}</span>` : ''; const nm = document.getElementById('namePreview'); if (nm) nm.textContent = namePreview(state.wizard); return; }
  if (t.dataset.d !== undefined && state.drawer){ state.drawer.f[t.dataset.d] = t.value; return; }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.w !== undefined && state.wizard && (t.type === 'radio' || t.tagName === 'SELECT')){ state.wizard[t.dataset.w] = t.value; render(); return; }
  if (t.dataset.wComp && state.wizard){ const c = t.dataset.wComp; const set = new Set(state.wizard.components); t.checked ? set.add(c) : set.delete(c); if (t.checked && c === 'srs') set.delete('ome'); if (t.checked && c === 'ome') set.delete('srs'); state.wizard.components = [...set]; render(); return; }
  if (t.dataset.d !== undefined && state.drawer && t.type === 'radio'){ state.drawer.f[t.dataset.d] = t.value; render(); return; }
});
document.addEventListener('submit', (e) => {
  const f = e.target; e.preventDefault();
  if (f.dataset.buy){ const fd = new FormData(f); buyStamp(f.dataset.buy, +fd.get('amount'), +fd.get('depth')); }
  if (f.dataset.add){ const fd = new FormData(f); addMembers(groupById(+f.dataset.add), Math.max(1, +fd.get('count') || 1)); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape'){ if (state.menu) state.menu = null; else if (state.confirm) state.confirm = null; else if (state.drawer) state.drawer = null; else if (state.wizard) state.wizard = null; else if (state.help) state.help = false; render(); } });

/* a little life in the numbers */
setInterval(() => { const h = state.host; h.cpu = Math.max(20, Math.min(70, h.cpu + (Math.random()-0.5)*3)); h.oursCpu = Math.max(12, Math.min(h.cpu-5, h.oursCpu + (Math.random()-0.5)*2)); h.cpu = Math.round(h.cpu); h.oursCpu = Math.round(h.oursCpu); h.netIn = +(h.netIn + (Math.random()-0.5)).toFixed(1); h.netOut = +(h.netOut + (Math.random()-0.5)*2).toFixed(1); if (['overview','host'].includes(state.route.page) && !state.wizard && !state.drawer && !state.menu && !state.confirm && !state.help) render(); }, 4000);

render();
</script>
</body>
</html>
